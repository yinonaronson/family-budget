<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הכיס המשפחתי">
<meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>הכיס המשפחתי</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f4f4f1; --plane-2:#eceae5;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.05);
  --shadow-lg:0 12px 40px rgba(11,11,11,.18);
  --r:14px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --plane-2:#242422;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--plane);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 120px}
.hide{display:none!important}

header.top{position:sticky;top:0;z-index:40;background:var(--plane);border-bottom:1px solid var(--ring)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-inline-end:auto}
.logo{width:28px;height:28px;border-radius:9px;background:var(--s1);display:grid;place-items:center;color:#fff;font-size:14px}
.monthnav{display:flex;align-items:center;background:var(--surface-1);border:1px solid var(--ring);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.monthnav button{background:none;border:0;padding:6px 11px;border-radius:8px;color:var(--text-secondary);font-size:17px;line-height:1}
.monthnav button:hover{background:var(--plane)}
.monthlbl{min-width:118px;text-align:center;font-weight:600;font-size:13.5px}
.iconbtn{background:var(--surface-1);border:1px solid var(--ring);border-radius:11px;padding:8px 11px;box-shadow:var(--shadow);line-height:1;position:relative}
.iconbtn:hover{background:var(--plane)}
.syncdot{position:absolute;top:5px;inset-inline-end:5px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.syncdot.busy{background:var(--warning);animation:pulse 1s infinite}
.syncdot.err{background:var(--critical)}
@keyframes pulse{50%{opacity:.3}}

nav.tabs{display:flex;gap:3px;overflow-x:auto;padding:10px 0 0;margin-bottom:16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--text-secondary);
  font-weight:600;font-size:14px;white-space:nowrap;border-radius:9px 9px 0 0;display:flex;align-items:center;gap:6px}
nav.tabs button:hover{color:var(--text-primary);background:var(--surface-1)}
nav.tabs button[aria-selected="true"]{color:var(--s1);border-bottom-color:var(--s1)}
nav.mobnav{display:none}
@media(max-width:719px){
  nav.tabs{display:none}
  nav.mobnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:45;
    background:var(--surface-1);border-top:1px solid var(--ring);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.mobnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;border-radius:11px;color:var(--muted);font-size:10.5px;font-weight:600}
  nav.mobnav button .ni{font-size:19px;line-height:1}
  nav.mobnav button[aria-selected="true"]{color:var(--s1);background:color-mix(in srgb,var(--s1) 9%,transparent)}
  .wrap{padding:12px 13px 150px}
  .top-in{padding:9px 13px}
  .brand span:last-child{display:none}
  .monthlbl{min-width:100px}
}

.card{background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 3px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.card .sub{margin:0 0 15px;font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}}

.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .ring{flex:none}
.hero .main{flex:1;min-width:190px}
.hero .cap{font-size:13px;color:var(--text-secondary);font-weight:600}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 4px}
.hero .note{font-size:12.5px;color:var(--muted)}
.pacepill{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;border:1px solid var(--ring)}
.split{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mini{flex:1;min-width:130px;background:var(--plane);border-radius:11px;padding:11px 13px}
.mini .l{font-size:11.5px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.mini .v{font-size:19px;font-weight:700;margin-top:2px}
@media(max-width:719px){
  .split{gap:7px}.mini{min-width:0;padding:9px 10px}
  .mini .l{font-size:10.5px;gap:4px}.mini .v{font-size:15.5px}
  .hero{gap:14px}.hero .big{font-size:34px}
}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pos{color:var(--good-ink)} .neg{color:var(--critical)}

.alertbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-1);border:1px solid var(--ring);
  border-radius:var(--r);padding:13px 15px;text-align:start;box-shadow:var(--shadow);margin-bottom:14px;font-size:14px}
.alertbar.crit{background:color-mix(in srgb,var(--critical) 9%,var(--surface-1));border-color:color-mix(in srgb,var(--critical) 32%,transparent)}
.alertbar.warn{background:color-mix(in srgb,var(--warning) 13%,var(--surface-1));border-color:color-mix(in srgb,var(--warning) 38%,transparent)}
.alertbar.ok{background:color-mix(in srgb,var(--good) 9%,var(--surface-1));border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.alertbar.info{background:color-mix(in srgb,var(--s1) 8%,var(--surface-1));border-color:color-mix(in srgb,var(--s1) 30%,transparent)}
.alertbar .ic{font-size:17px;flex:none}
.alertbar .arrow{margin-inline-start:auto;color:var(--muted);font-size:13px;flex:none}
.alertlist{margin:-6px 0 14px;padding:0 2px}
.alertlist .row{display:flex;gap:9px;align-items:flex-start;padding:9px 13px;font-size:13.5px;border-inline-start:3px solid var(--grid);
  background:var(--surface-1);border-radius:0 10px 10px 0;margin-bottom:6px;border:1px solid var(--ring)}
.alertlist .row.crit{border-inline-start-color:var(--critical)}
.alertlist .row.warn{border-inline-start-color:var(--warning)}

.bars{display:flex;flex-direction:column;gap:14px}
.brow .line1{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.brow .ic{font-size:15px;width:22px;text-align:center;flex:none}
.brow .nm{font-weight:600}
.brow .freq{font-size:10.5px;color:var(--muted);background:var(--plane);border-radius:999px;padding:1px 7px;white-space:nowrap}
.brow .amt{margin-inline-start:auto;color:var(--text-secondary);font-variant-numeric:tabular-nums;font-size:12.5px}
.brow .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;min-width:52px;text-align:end;white-space:nowrap}
.track{position:relative;height:9px;background:var(--grid);border-radius:5px;overflow:hidden}
.fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px;transition:width .35s ease}
.over{position:absolute;inset-block:0;background:repeating-linear-gradient(135deg,var(--critical),var(--critical) 4px,transparent 4px,transparent 8px);opacity:.9}
.pacemark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-primary);opacity:.45;border-radius:2px}
.linkbtn{background:none;border:0;color:var(--s1);font-weight:600;font-size:13px;padding:8px 0 0}
.cName{transition:background .15s}
.cName:hover{background:var(--plane)!important;border-color:var(--ring)!important}

.tlist{display:flex;flex-direction:column;gap:2px}
.titem{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:11px;width:100%;text-align:start;background:none;border:0}
.titem:hover{background:var(--plane)}
.titem .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--plane-2);flex:none}
.titem .mid{min-width:0;flex:1}
.titem .t1{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.titem .t2{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.titem .val{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
.titem .chev{color:var(--axis);font-size:15px;flex:none}
.mavatar{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.pin{font-size:10px;background:var(--plane-2);border-radius:999px;padding:1px 6px;color:var(--text-secondary)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:13.5px}
.empty .eic{font-size:34px;display:block;margin-bottom:8px;opacity:.55}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-secondary);font-weight:600}
input,select{background:var(--plane);border:1px solid var(--ring);border-radius:10px;padding:10px 11px;font-size:15px;width:100%}
input:focus,select:focus{outline:2px solid var(--s1);outline-offset:-1px}
.btn{background:var(--s1);color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--plane);color:var(--text-primary);border:1px solid var(--ring)}
.btn.danger{background:var(--critical)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%;display:block;padding:14px;font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.chipsel{display:flex;gap:7px;flex-wrap:wrap}
.chipsel button{background:var(--plane);border:1px solid var(--ring);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:7px}
.chipsel button[aria-pressed="true"]{background:color-mix(in srgb,var(--s1) 12%,var(--surface-1));border-color:var(--s1);color:var(--s1)}
.seg{display:inline-flex;background:var(--plane);border:1px solid var(--ring);border-radius:11px;padding:3px;gap:2px;width:100%}
.seg button{flex:1;background:none;border:0;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-secondary)}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-primary);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"][data-v="income"]{color:var(--good-ink)}

.fab{position:fixed;inset-inline-end:22px;bottom:26px;z-index:50;width:58px;height:58px;border-radius:19px;border:0;
  background:var(--s1);color:#fff;font-size:29px;line-height:1;box-shadow:0 8px 24px color-mix(in srgb,var(--s1) 45%,transparent);
  display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.93)}
@media(max-width:719px){.fab{bottom:calc(78px + env(safe-area-inset-bottom));inset-inline-end:16px;width:56px;height:56px}}

.offbar{position:fixed;inset-inline:0;top:0;z-index:90;background:var(--warning);color:#0b0b0b;text-align:center;
  font-size:12.5px;font-weight:600;line-height:1.35;height:calc(26px + env(safe-area-inset-top));
  padding:calc(5px + env(safe-area-inset-top)) 12px 0;display:none}
body.offline .offbar{display:block}
/* הפס דוחף את התוכן במקום לכסות אותו */
body{padding-top:env(safe-area-inset-top)}
body.offline,body.offline .wiz{padding-top:calc(26px + env(safe-area-inset-top))}
.wiz{padding-top:env(safe-area-inset-top)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;background:var(--surface-1);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  transition:transform .25s cubic-bezier(.32,.72,0,1)}
@media(min-width:720px){
  .sheet{top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;
    width:min(520px,94vw);max-height:88vh;border-radius:20px}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
}
@media(max-width:719px){
  .sheet{inset-inline:0;bottom:0;max-height:94vh;border-radius:20px 20px 0 0;transform:translateY(100%)}
  .sheet.on{transform:translateY(0)}
}
.sheet-head{padding:14px 17px 10px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-size:16px;font-weight:700}
.sheet-head .x{margin-inline-start:auto;background:var(--plane);border:0;border-radius:10px;width:32px;height:32px;font-size:16px;color:var(--text-secondary)}
.sheet-body{padding:0 17px 14px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 17px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--grid);background:var(--surface-1);
  border-radius:0 0 20px 20px;display:flex;gap:9px;align-items:center}
.grab{width:38px;height:4px;border-radius:99px;background:var(--axis);margin:8px auto 0}
@media(min-width:720px){.grab{display:none}}
.amtbox{text-align:center;padding:13px 0 11px;position:sticky;top:0;z-index:2;background:var(--surface-1);box-shadow:0 6px 10px -8px var(--ring)}
.amtbox .cur{font-size:20px;color:var(--muted);font-weight:600;vertical-align:6px}
.amtbox .val{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amtbox .val.zero{color:var(--axis)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.keypad button{background:var(--plane);border:1px solid var(--ring);border-radius:12px;padding:13px 0;font-size:20px;font-weight:600}
.keypad button:active{background:var(--plane-2)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:400px){.catgrid{grid-template-columns:repeat(3,1fr)}}
.catgrid button{background:var(--plane);border:1px solid var(--ring);border-radius:13px;padding:11px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--text-secondary);line-height:1.25;text-align:center}
.catgrid button .ci{font-size:21px;line-height:1}
.catgrid button[aria-pressed="true"]{background:color-mix(in srgb,var(--s1) 13%,var(--surface-1));border-color:var(--s1);color:var(--s1)}
.fieldlbl{font-size:12px;font-weight:700;color:var(--text-secondary);margin:16px 0 8px}

.wiz{position:fixed;inset:0;z-index:70;background:var(--plane);overflow-y:auto;display:none}
.wiz.on{display:block}
.wiz-in{max-width:520px;margin:0 auto;padding:34px 20px 40px;min-height:100%;display:flex;flex-direction:column}
.wiz .steps{display:flex;gap:6px;margin-bottom:26px}
.wiz .steps i{height:4px;flex:1;border-radius:99px;background:var(--grid)}
.wiz .steps i.on{background:var(--s1)}
.wiz h1{font-size:25px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
.wiz p.lead{color:var(--text-secondary);font-size:14.5px;margin:0 0 24px}
.wiz .body{flex:1}
.wiz .foot{display:flex;gap:10px;align-items:center;padding-top:26px}
.wiz .skip{background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:600}
.rowline{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.rowline .ic{font-size:19px;width:26px;text-align:center;flex:none}
.rowline .nm{flex:1;font-size:14px;font-weight:600}
.rowline input{max-width:118px}
.checkline{display:flex;gap:10px;align-items:center;background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.checkline input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--s1)}
.checkline .nm{flex:1;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.checkline input[type=number]{max-width:108px}

.chart-wrap{position:relative}
svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--ring);border-radius:11px;
  padding:9px 11px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap}
.tip b{font-variant-numeric:tabular-nums}
.tip-row{display:flex;align-items:center;gap:7px;margin-top:4px}
code{background:var(--plane-2);padding:1px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
footer.note{color:var(--muted);font-size:11.5px;text-align:center;padding:6px 16px 20px}
@media(max-width:719px){footer.note{padding-bottom:90px}}
.toast{position:fixed;inset-inline:0;bottom:0;z-index:80;display:flex;justify-content:center;pointer-events:none;padding-bottom:26px}
@media(max-width:719px){.toast{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
.toast div{background:var(--text-primary);color:var(--surface-1);padding:11px 18px;border-radius:99px;font-size:13.5px;
  font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(12px);transition:all .22s;
  display:flex;align-items:center;gap:12px;pointer-events:auto;max-width:92vw}
.toast div.on{opacity:1;transform:translateY(0)}
.toast button{background:none;border:0;color:var(--s1);font-weight:700;font-size:13.5px;filter:brightness(1.5)}
/* ---------- מסך כניסה ---------- */
.auth{position:fixed;inset:0;z-index:90;background:var(--plane);overflow-y:auto;display:none;
  align-items:center;justify-content:center;padding:24px 18px}
.auth.on{display:flex}
.authbox{width:100%;max-width:380px;background:var(--surface-1);border:1px solid var(--ring);
  border-radius:18px;padding:30px 24px 26px;box-shadow:var(--shadow);text-align:center}
.authlogo{width:52px;height:52px;border-radius:16px;background:var(--s1);color:#fff;
  display:grid;place-items:center;font-size:25px;margin:0 auto 14px}
.authbox h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.authbox .f{text-align:right;margin-bottom:12px}
.authalt{margin-top:18px;font-size:13.5px;color:var(--text-secondary);line-height:2}
.authalt a{color:var(--s1);font-weight:600;text-decoration:none}
.authalt a:hover{text-decoration:underline}
.authboot{position:fixed;inset:0;z-index:95;background:var(--plane);display:grid;place-items:center;
  text-align:center;color:var(--muted);font-size:14px}
.authboot.off{display:none}

/* ---------- הודעת אחסון ועוגיות ---------- */

/* מקודד QR מינימלי — מצב בייטים, רמת תיקון שגיאות M. מספיק לקישור ההזמנה. */
var QR=(function(){
  var EXP=new Array(512),LOG=new Array(256);
  (function(){for(var i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=285}
    for(var j=255;j<512;j++)EXP[j]=EXP[j-255]})();
  function mul(a,b){return(a===0||b===0)?0:EXP[(LOG[a]+LOG[b])%255]}
  function rsPoly(n){var p=[1];for(var i=0;i<n;i++){var q=[];for(var j=0;j<=p.length;j++){
    var v=0;if(j<p.length)v^=p[j];if(j>0)v^=mul(p[j-1],EXP[i]);q[j]=v}p=q}return p}
  function rsEnc(data,n){var res=new Array(n).fill(0),g=rsPoly(n);
    for(var i=0;i<data.length;i++){var f=data[i]^res[0];res.shift();res.push(0);
      if(f!==0)for(var j=0;j<n;j++)res[j]^=mul(g[j+1],f)}
    return res}

  /* לכל גרסה 1..20 ברמת M: [סה"כ קודוני נתונים, קודוני EC לבלוק, בלוקים בקבוצה1, נתונים בבלוק1, בלוקים בקבוצה2, נתונים בבלוק2] */
  var M=[null,
   [16,10,1,16,0,0],[28,16,1,28,0,0],[44,26,1,44,0,0],[64,18,2,32,0,0],[86,24,2,43,0,0],
   [108,16,4,27,0,0],[124,18,4,31,0,0],[154,22,2,38,2,39],[182,22,3,36,2,37],[216,26,4,43,1,44],
   [254,30,1,50,4,51],[290,22,6,36,2,37],[334,22,8,37,1,38],[365,24,4,40,5,41],[415,24,5,41,5,42],
   [453,28,7,45,3,46],[507,28,10,46,1,47],[563,26,9,43,4,44],[627,26,3,44,11,45],[669,26,3,41,13,42]];

  var ALIGN=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
   [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],
   [6,30,58,86],[6,34,62,90]];

  function bch15(v){var d=v<<10;for(var i=4;i>=0;i--)if(d>>>(10+i)&1)d^=0x537<<i;return((v<<10)|d)^0x5412}
  function bch18(v){var d=v<<12;for(var i=5;i>=0;i--)if(d>>>(12+i)&1)d^=0x1f25<<i;return(v<<12)|d}

  function encode(text){
    var bytes=[],i;
    for(i=0;i<text.length;i++){var c=text.charCodeAt(i);
      if(c<128)bytes.push(c);
      else if(c<2048){bytes.push(192|c>>6,128|c&63)}
      else{bytes.push(224|c>>12,128|c>>6&63,128|c&63)}}

    var ver=0;
    for(i=1;i<M.length;i++){var cc=(i<10)?8:16;
      if(M[i][0]*8>=4+cc+bytes.length*8){ver=i;break}}
    if(!ver)throw new Error('too long');

    var spec=M[ver],total=spec[0],ecLen=spec[1];
    var bits=[];
    function put(v,n){for(var k=n-1;k>=0;k--)bits.push(v>>>k&1)}
    put(4,4);put(bytes.length,(ver<10)?8:16);
    for(i=0;i<bytes.length;i++)put(bytes[i],8);
    for(i=0;i<4&&bits.length<total*8;i++)bits.push(0);
    while(bits.length%8)bits.push(0);
    var dc=[];for(i=0;i<bits.length;i+=8){var b=0;for(var k=0;k<8;k++)b=(b<<1)|bits[i+k];dc.push(b)}
    var pad=[236,17],p=0;while(dc.length<total)dc.push(pad[p++%2]);

    /* פיצול לבלוקים */
    var blocks=[],ecs=[],off=0,g;
    for(g=0;g<spec[2];g++){var d=dc.slice(off,off+spec[3]);off+=spec[3];blocks.push(d);ecs.push(rsEnc(d,ecLen))}
    for(g=0;g<spec[4];g++){var d2=dc.slice(off,off+spec[5]);off+=spec[5];blocks.push(d2);ecs.push(rsEnc(d2,ecLen))}

    var out=[],maxD=Math.max(spec[3],spec[5]||0);
    for(i=0;i<maxD;i++)for(g=0;g<blocks.length;g++)if(i<blocks[g].length)out.push(blocks[g][i]);
    for(i=0;i<ecLen;i++)for(g=0;g<ecs.length;g++)out.push(ecs[g][i]);

    /* מטריצה */
    var size=ver*4+17;
    var m=[],res=[];
    for(i=0;i<size;i++){m.push(new Array(size).fill(null));res.push(new Array(size).fill(false))}
    function setF(r,c,v){if(r<0||c<0||r>=size||c>=size)return;m[r][c]=v;res[r][c]=true}

    function finder(r,c){for(var dr=-1;dr<8;dr++)for(var dc2=-1;dc2<8;dc2++){
      var rr=r+dr,cc2=c+dc2;if(rr<0||cc2<0||rr>=size||cc2>=size)continue;
      var inb=(dr>=0&&dr<7&&dc2>=0&&dc2<7);
      var on=inb&&((dr===0||dr===6||dc2===0||dc2===6)||(dr>=2&&dr<=4&&dc2>=2&&dc2<=4));
      setF(rr,cc2,on)}}
    finder(0,0);finder(0,size-7);finder(size-7,0);

    for(i=8;i<size-8;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}

    var ap=ALIGN[ver];
    for(var a=0;a<ap.length;a++)for(var b2=0;b2<ap.length;b2++){
      var ar=ap[a],ac=ap[b2];
      if((ar<8&&ac<8)||(ar<8&&ac>size-9)||(ar>size-9&&ac<8))continue;
      for(var dr2=-2;dr2<=2;dr2++)for(var dc3=-2;dc3<=2;dc3++)
        setF(ar+dr2,ac+dc3,Math.max(Math.abs(dr2),Math.abs(dc3))!==1)}

    setF(size-8,8,true);
    for(i=0;i<9;i++){setF(8,i,m[8][i]===null?false:m[8][i]);setF(i,8,m[i][8]===null?false:m[i][8])}
    for(i=0;i<8;i++){setF(8,size-1-i,false);setF(size-1-i,8,false)}

    if(ver>=7){var vb=bch18(ver);
      for(i=0;i<18;i++){var bit=(vb>>>i&1)===1;
        setF(Math.floor(i/3),size-11+i%3,bit);setF(size-11+i%3,Math.floor(i/3),bit)}}

    /* פריסת נתונים */
    var dirUp=true,idx=0,bitIdx=0,col=size-1;
    while(col>0){
      if(col===6)col--;
      for(var t=0;t<size;t++){
        var row=dirUp?size-1-t:t;
        for(var s=0;s<2;s++){var cc4=col-s;
          if(res[row][cc4])continue;
          var v=false;
          if(idx<out.length)v=((out[idx]>>>(7-bitIdx))&1)===1;
          m[row][cc4]=v;
          bitIdx++;if(bitIdx===8){bitIdx=0;idx++}}}
      dirUp=!dirUp;col-=2}

    function maskFn(k,r,c){switch(k){
      case 0:return (r+c)%2===0; case 1:return r%2===0; case 2:return c%3===0;
      case 3:return (r+c)%3===0; case 4:return (Math.floor(r/2)+Math.floor(c/3))%2===0;
      case 5:return (r*c)%2+(r*c)%3===0; case 6:return ((r*c)%2+(r*c)%3)%2===0;
      default:return ((r+c)%2+(r*c)%3)%2===0}}

    function penalty(g2){
      var n=0,r,c,i2,run,prev;
      for(r=0;r<size;r++){run=1;prev=g2[r][0];
        for(c=1;c<size;c++){if(g2[r][c]===prev)run++;else{if(run>=5)n+=3+(run-5);run=1;prev=g2[r][c]}}
        if(run>=5)n+=3+(run-5)}
      for(c=0;c<size;c++){run=1;prev=g2[0][c];
        for(r=1;r<size;r++){if(g2[r][c]===prev)run++;else{if(run>=5)n+=3+(run-5);run=1;prev=g2[r][c]}}
        if(run>=5)n+=3+(run-5)}
      for(r=0;r<size-1;r++)for(c=0;c<size-1;c++)
        if(g2[r][c]===g2[r][c+1]&&g2[r][c]===g2[r+1][c]&&g2[r][c]===g2[r+1][c+1])n+=3;
      var pat=[true,false,true,true,true,false,true,false,false,false,false];
      function has(arr,st){for(var q=0;q<11;q++)if(arr[st+q]!==pat[q])return false;return true}
      function hasR(arr,st){for(var q=0;q<11;q++)if(arr[st+q]!==pat[10-q])return false;return true}
      for(r=0;r<size;r++)for(c=0;c+11<=size;c++){if(has(g2[r],c))n+=40;if(hasR(g2[r],c))n+=40}
      for(c=0;c<size;c++){var colArr=[];for(r=0;r<size;r++)colArr.push(g2[r][c]);
        for(r=0;r+11<=size;r++){if(has(colArr,r))n+=40;if(hasR(colArr,r))n+=40}}
      var dark=0;for(r=0;r<size;r++)for(c=0;c<size;c++)if(g2[r][c])dark++;
      n+=Math.floor(Math.abs(dark*100/(size*size)-50)/5)*10;
      return n}

    var best=null,bestP=Infinity,bestMask=0;
    for(var k2=0;k2<8;k2++){
      var g3=[];for(r2=0;r2<size;r2++)g3.push(m[r2].slice());
      var r2,c2;
      for(r2=0;r2<size;r2++)for(c2=0;c2<size;c2++)
        if(!res[r2][c2]&&maskFn(k2,r2,c2))g3[r2][c2]=!g3[r2][c2];
      var fb=bch15((0<<3)|k2);   /* 0 = רמת M */
      for(i=0;i<15;i++){var bt=((fb>>>i)&1)===1;
        if(i<6)g3[i][8]=bt; else if(i<8)g3[i+1][8]=bt; else g3[size-15+i][8]=bt;
        if(i<8)g3[8][size-1-i]=bt; else if(i<9)g3[8][15-i]=bt; else g3[8][14-i]=bt}
      g3[size-8][8]=true;
      var pn=penalty(g3);
      if(pn<bestP){bestP=pn;best=g3;bestMask=k2}}
    return best;
  }

  function svg(text,px,quiet){
    var g=encode(text),n=g.length,q=(quiet===undefined?4:quiet),tot=n+q*2,d='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)
      if(g[r][c])d+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+tot+' '+tot+'" width="'+(px||220)+'" height="'+(px||220)+'" shape-rendering="crispEdges" role="img" aria-label="QR">'
      +'<rect width="'+tot+'" height="'+tot+'" fill="#ffffff"/><path d="'+d+'" fill="#000000"/></svg>';
  }
  return {encode:encode,svg:svg};
})();

/* ==================== עזרים ==================== */
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const nf=new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const money=n=>'₪'+nf.format(Math.round(n||0));
const monthLabel=m=>MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4);
const shortMonth=m=>MONTHS[+m.slice(5,7)-1].slice(0,3);
const todayStr=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
function shiftMonth(m,d){const[y,mo]=m.split('-').map(Number);const dt=new Date(y,mo-1+d,1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sc=slot=>`var(--s${((slot-1)%8)+1})`;
const catById=id=>S.categories.find(c=>c.id===id);
const anyCat=id=>S.categories.find(c=>c.id===id)||S.incomeCats.find(c=>c.id===id);
const memById=id=>S.members.find(m=>m.id===id);
const myMemberId=()=>{
  const id=SESSION&&SESSION.user&&SESSION.user.id;
  return (id&&memById(id))?id:((S.members[0]||{}).id||'');
};
/* אנשים בבית שאין להם חשבון במערכת — נשמרים כשם חופשי על התנועה עצמה */
const labelList=()=>[...new Set(S.tx.map(t=>t.memberLabel).filter(Boolean))].sort();
function who(t){
  const m=memById(t.memberId);
  if(m)return m;
  if(t.memberLabel){
    const i=labelList().indexOf(t.memberLabel);
    return {id:'lbl:'+t.memberLabel,name:t.memberLabel,slot:S.members.length+(i<0?0:i)+1};
  }
  return null;
}
const txOf=m=>S.tx.filter(t=>t.date.slice(0,7)===m);
const FREQ=[[1,'חודשי'],[2,'כל חודשיים'],[3,'רבעוני'],[6,'חצי שנתי'],[12,'שנתי']];
const freqLabel=f=>(FREQ.find(x=>x[0]===(+f||1))||FREQ[0])[1];
const monthlyAlloc=c=>(+c.budget||0)/Math.max(1,+c.freq||1);

function totals(m){const t=txOf(m);
  const income=t.filter(x=>x.type==='income').reduce((a,b)=>a+b.amount,0);
  const expense=t.filter(x=>x.type==='expense').reduce((a,b)=>a+b.amount,0);
  return{income,expense,net:income-expense}}
function spentByCat(m){const o={};txOf(m).filter(t=>t.type==='expense').forEach(t=>o[t.catId]=(o[t.catId]||0)+t.amount);return o}
/* ניצול נמדד בחלון התדירות: קטגוריה דו-חודשית נמדדת מול הוצאות שני החודשים האחרונים */
function usage(c,m){
  const f=Math.max(1,+c.freq||1);let sp=0;
  for(let i=0;i<f;i++)sp+=(spentByCat(shiftMonth(m,-i))[c.id]||0);
  const b=+c.budget||0;
  return{sp,b,f,pct:b?sp/b*100:(sp?100:0)};
}
function status(pct){
  if(pct>100)return{k:'crit',c:'var(--critical)',ic:'⛔'};
  if(pct>=85)return{k:'warn',c:'var(--warning)',ic:'⚠️'};
  return{k:'ok',c:'var(--good)',ic:'✓'}}
const avatar=m=>`<i class="mavatar" style="background:${sc(m?m.slot:8)}">${esc((m?m.name:'?').trim()[0]||'?')}</i>`;
/* קטגוריה "קבועה" = יש לה הוראת קבע פעילה; היא יורדת ביום אחד ולכן אינה נכנסת לחישוב הקצב */
const isFixedCat=id=>S.recurring.some(r=>r.active!==false&&r.catId===id);
function pace(m){
  if(m!==thisMonth())return null;
  const d=new Date(), day=d.getDate(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const frac=day/dim;
  const varCats=S.categories.filter(c=>!isFixedCat(c.id));
  const budget=varCats.reduce((a,c)=>a+monthlyAlloc(c),0);
  if(!budget)return null;
  const ids=new Set(varCats.map(c=>c.id));
  const spent=txOf(m).filter(t=>t.type==='expense'&&ids.has(t.catId)).reduce((a,t)=>a+t.amount,0);
  const expected=budget*frac;
  return{frac,day,dim,budget,spent,expected,delta:(spent-expected)/budget*100};
}
let toastT;
function toast(msg,action){
  const el=document.getElementById('toast');
  el.innerHTML=`<span>${msg}</span>${action?`<button id="toastAct">${action.label}</button>`:''}`;
  el.classList.add('on');
  if(action)document.getElementById('toastAct').onclick=()=>{action.fn();el.classList.remove('on')};
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),action?6000:2400);
}

/* ==================== חיבור ל-Supabase ==================== */
/* window.SUPA מוגדר ב-config שמוטמע בראש הקובץ.
   בבדיקות מוזרק לקוח מזויף ב-window.__FAKE_SUPA, וכל השאר זהה. */
let sb=null, SESSION=null, HH=null;   /* HH = המשפחה הפעילה */

/* ספריית Supabase יושבת אצלנו בשרת (supabase.js) ולא ב-CDN חיצוני:
   פחות תלות בצד שלישי, והדף לא פונה לאף מקור זר בזמן הטעינה. */
async function initClient(){
  if(window.__FAKE_SUPA){sb=window.__FAKE_SUPA;return true}
  try{
    let lib=window.supabase;
    if(!lib||!lib.createClient)lib=await import('https://esm.sh/@supabase/supabase-js@2');
    sb=lib.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true}});
    return !!sb;
  }catch(e){lastError=e.message||String(e);return false}
}

/* ==================== מצב ==================== */
const uid=()=>(crypto.randomUUID?crypto.randomUUID():
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)}));
const now=()=>Date.now();

function emptyState(){
  return {categories:[],incomeCats:[],members:[],tx:[],recurring:[],loadedMonths:[],onboarded:false};
}
let S=emptyState();

/* מה שהשתנה ועוד לא נכתב לשרת */
const DIRTY=new Set();
const GONE=[];
let flushTimer=null, flushing=false, lastError=null;

const COLLS=[['tx','transactions'],['categories','categories'],
             ['incomeCats','categories'],['members','household_members'],
             ['recurring','recurring']];
function collOf(o){
  for(const [k,t] of COLLS) if(S[k].indexOf(o)>=0) return {coll:k,table:t};
  return null;
}

/* touch נקרא בכל מקום שבו הקוד משנה רשומה — זה הקרס שלנו */
const touch=o=>{o.mt=now();DIRTY.add(o);return o};

function removeRec(coll,id){
  const rec=S[coll].find(r=>r.id===id);
  if(rec)DIRTY.delete(rec);
  S[coll]=S[coll].filter(r=>r.id!==id);
  const t=(COLLS.find(c=>c[0]===coll)||[])[1];
  if(t&&rec)GONE.push({table:t,id,coll});
}

/* ביטול מחיקה: מוציאים את הרשומה מתור המחיקות ומחזירים אותה למקום */
function undoRemove(coll,rec){
  const i=GONE.findIndex(g=>g.id===rec.id);
  if(i>=0)GONE.splice(i,1);
  S[coll].push(touch(rec));
  save();
}

function save(immediate){
  clearTimeout(flushTimer);
  if(immediate===false)return;            /* תאימות לקוד ישן שקרא save(false) */
  flushTimer=setTimeout(flush,immediate===true?0:500);
}

/* נורית המצב בכותרת: ירוק=נשמר, צהוב=בדרך לשרת, אדום=נכשל */
let syncState='ok';
function setSyncUI(st){
  if(st)syncState=st;
  const btn=document.getElementById('syncBtn'), dot=document.getElementById('syncDot');
  if(!btn||!dot)return;
  const pend=DIRTY.size+GONE.length;
  btn.classList.toggle('hide',!HH);
  dot.className='syncdot'+(syncState==='busy'?' busy':syncState==='err'?' err':'');
  btn.title=syncState==='err'?('השמירה נכשלה — לחצו לניסיון נוסף'+(lastError?': '+lastError:''))
    :pend?'יש שינויים בדרך לשרת':'הכול שמור בשרת';
}

/* ---------- המרה בין צורת המסך לצורת הטבלה ---------- */
const toRow={
  transactions:o=>({id:o.id,household_id:HH.id,kind:o.type||'expense',amount:o.amount,
    occurred_on:o.date,category_id:o.catId||null,member_id:o.memberId||null,
    member_label:o.memberLabel||null,note:o.note||null,is_fixed:!!o.fixed}),
  categories:o=>({id:o.id,household_id:HH.id,kind:o.kind||(S.incomeCats.indexOf(o)>=0?'income':'expense'),
    name:o.name,icon:o.icon||'📌',budget:+o.budget||0,freq:Math.max(1,+o.freq||1),slot:+o.slot||1}),
  household_members:o=>({household_id:HH.id,user_id:o.id,display_name:o.name,slot:+o.slot||1}),
  recurring:o=>({id:o.id,household_id:HH.id,name:o.name,amount:o.amount,
    category_id:o.catId||null,member_id:o.memberId||null,
    day_of_month:Math.min(28,Math.max(1,+o.day||1)),active:o.active!==false}),
};
const fromRow={
  transactions:r=>({id:r.id,type:r.kind,amount:+r.amount,date:r.occurred_on,catId:r.category_id,
    memberId:r.member_id,memberLabel:r.member_label,note:r.note||'',fixed:!!r.is_fixed,mt:0}),
  category:r=>({id:r.id,kind:r.kind,name:r.name,icon:r.icon,budget:+r.budget,
    freq:+r.freq||1,slot:+r.slot||1,mt:0}),
  household_members:r=>({id:r.user_id,name:r.display_name,slot:+r.slot||1,role:r.role,mt:0}),
  recurring:r=>({id:r.id,name:r.name,amount:+r.amount,catId:r.category_id,memberId:r.member_id,
    day:+r.day_of_month||1,active:r.active!==false,mt:0}),
};

async function flush(){
  if(flushing||!HH||!sb)return true;
  const dirty=[...DIRTY], gone=GONE.splice(0);
  if(!dirty.length&&!gone.length)return true;
  flushing=true;setSyncUI('busy');
  try{
    /* מחיקות קודם, כדי שהוספה מחדש של אותו שם לא תיפול על אינדקס ייחודי */
    for(const g of gone){
      if(g.table==='household_members'){
        const {error}=await sb.from('household_members').delete()
          .eq('household_id',HH.id).eq('user_id',g.id);
        if(error)throw error;
      }else{
        const {error}=await sb.from(g.table).delete().eq('id',g.id);
        if(error)throw error;
      }
    }
    /* קיבוץ לפי טבלה — upsert אחד לכל טבלה במקום בקשה לכל רשומה */
    const byTable={};
    dirty.forEach(o=>{
      const c=collOf(o);if(!c)return;
      (byTable[c.table]=byTable[c.table]||[]).push(toRow[c.table](o));
    });
    for(const [table,rows] of Object.entries(byTable)){
      const opts=table==='household_members'?{onConflict:'household_id,user_id'}:{onConflict:'id'};
      const {error}=await sb.from(table).upsert(rows,opts);
      if(error)throw error;
    }
    dirty.forEach(o=>DIRTY.delete(o));
    lastError=null;setSyncUI('ok');
    return true;
  }catch(e){
    gone.forEach(g=>GONE.push(g));       /* להחזיר לתור, לא לאבד מחיקות */
    lastError=e.message||String(e);
    setSyncUI('err');
    toast('השמירה נכשלה: '+lastError);
    return false;
  }finally{flushing=false}
}

async function loadHousehold(){
  const {data:mem,error:e1}=await sb.from('household_members')
    .select('household_id,display_name,role,slot,households(id,name,onboarded)').limit(1);
  if(e1)throw e1;
  if(!mem||!mem.length){HH=null;return null}
  const row=mem[0], h=row.households||{};
  HH={id:row.household_id,name:h.name||'המשפחה שלי',onboarded:!!h.onboarded,role:row.role};
  return HH;
}

async function loadAll(){
  if(!HH)return;
  const [cats,txs,recs,mems,months]=await Promise.all([
    sb.from('categories').select('*').eq('household_id',HH.id).eq('archived',false),
    sb.from('transactions').select('*').eq('household_id',HH.id).order('occurred_on',{ascending:false}),
    sb.from('recurring').select('*').eq('household_id',HH.id),
    sb.from('household_members').select('*').eq('household_id',HH.id),
    sb.from('loaded_months').select('month').eq('household_id',HH.id),
  ]);
  for(const r of [cats,txs,recs,mems,months]) if(r.error) throw r.error;
  const all=(cats.data||[]).map(fromRow.category);
  S.categories = all.filter(c=>c.kind==='expense').sort((a,b)=>a.slot-b.slot);
  S.incomeCats = all.filter(c=>c.kind==='income');
  S.tx         = (txs.data||[]).map(fromRow.transactions);
  S.recurring  = (recs.data||[]).map(fromRow.recurring);
  S.members    = (mems.data||[]).map(fromRow.household_members).sort((a,b)=>a.slot-b.slot);
  S.loadedMonths=(months.data||[]).map(r=>r.month);
  S.onboarded  = !!(HH&&HH.onboarded);
  DIRTY.clear();GONE.length=0;
}

async function createHousehold(name,displayName){
  const hid=uid();
  const {error:e1}=await sb.from('households').insert({id:hid,name:name||'המשפחה שלי',created_by:SESSION.user.id});
  if(e1)throw e1;
  const {error:e2}=await sb.from('household_members').insert({
    household_id:hid,user_id:SESSION.user.id,display_name:displayName||'אני',role:'owner',slot:1});
  if(e2)throw e2;
  const rows=DEFAULT_CATS.map(([icon,n,b,slot,freq])=>
      ({id:uid(),household_id:hid,kind:'expense',icon,name:n,budget:b,slot,freq}))

      ({id:uid(),household_id:hid,kind:'income',icon,name:n,budget:0,slot:i+1,freq:1})));

}

let authMode='in', authBusy=false, pendingInvite=null;

const AUTH_MSG={
  'Invalid login credentials':'המייל או הסיסמה אינם נכונים',
  'Email not confirmed':'צריך לאשר את המייל — שלחנו לכם קישור',
  'User already registered':'המייל הזה כבר רשום. נסו להתחבר',
  'Password should be at least 6 characters':'הסיסמה חייבת להיות באורך 6 תווים לפחות',
};
const authErr=m=>AUTH_MSG[m]||m||'משהו השתבש';

function showAuth(){
  document.getElementById('auth').classList.add('on');
  document.body.style.overflow='hidden';
  drawAuth();
}
function hideAuth(){

function drawAuth(){
  const inv=pendingInvite?`<p class="sub" style="background:color-mix(in srgb,var(--s1) 10%,transparent);
      border-radius:10px;padding:10px 12px;margin:0 0 14px">
      🎉 הוזמנתם למשפחה. ${authMode==='up'?'צרו חשבון':'התחברו'} וההזמנה תמומש אוטומטית.</p>`:'';

  document.getElementById('authIn').innerHTML=`
    <div class="authbox">
      <div class="authlogo">₪</div>
      <h1>הכיס המשפחתי</h1>
      <p class="sub" style="margin:0 0 18px">${authMode==='up'?'יצירת חשבון חדש':'כניסה לחשבון'}</p>
      ${inv}
      <label class="f">אימייל
        <input id="aEmail" type="email" inputmode="email" autocomplete="email" dir="ltr"
               style="text-align:left" placeholder="you@example.com"></label>
      ${authMode==='up'?`<label class="f">איך קוראים לכם?
        <input id="aName" autocomplete="name" placeholder="השם שיוצג לבני המשפחה"></label>`:''}
      <label class="f">סיסמה
        <input id="aPass" type="password" dir="ltr" style="text-align:left"
               autocomplete="${authMode==='up'?'new-password':'current-password'}"
               placeholder="${authMode==='up'?'לפחות 6 תווים':''}"></label>
      <p class="sub" id="aErr" style="color:var(--critical);min-height:18px;margin:6px 0 0"></p>
      <button class="btn" id="aGo" style="width:100%;margin-top:8px">
        ${authMode==='up'?'יצירת חשבון':'כניסה'}</button>
      <div class="authalt">
        ${authMode==='up'
          ? 'כבר יש לכם חשבון? <a href="#" id="aSwitch">כניסה</a>'
          : 'אין לכם חשבון? <a href="#" id="aSwitch">הרשמה</a>'}
        ${authMode==='in'?'<br><a href="#" id="aForgot">שכחתי סיסמה</a>':''}
      </div>
    </div>`;

  const err=m=>{document.getElementById('aErr').textContent=m||''};
  const go=document.getElementById('aGo');

  document.getElementById('aSwitch').onclick=e=>{e.preventDefault();authMode=authMode==='up'?'in':'up';drawAuth()};
  const fg=document.getElementById('aForgot');
  if(fg)fg.onclick=async e=>{
    e.preventDefault();
    const email=(document.getElementById('aEmail').value||'').trim();
    if(!email){err('רשמו קודם את המייל שלכם, ואז לחצו כאן');return}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    err('');toast(error?authErr(error.message):'שלחנו לכם קישור לאיפוס סיסמה ✓');
  };

  go.onclick=async()=>{
    if(authBusy)return;
    const email=(document.getElementById('aEmail').value||'').trim();
    const pass=document.getElementById('aPass').value||'';
    const nameEl=document.getElementById('aName');
    const name=nameEl?(nameEl.value||'').trim():'';
    if(!email||!pass){err('צריך מייל וסיסמה');return}
    if(authMode==='up'&&pass.length<6){err('הסיסמה חייבת להיות באורך 6 תווים לפחות');return}

    authBusy=true;go.disabled=true;go.textContent='רגע…';err('');
    try{
      if(authMode==='up'){
        const {data,error}=await sb.auth.signUp({email,password:pass,
          options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){

      }else{
        const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
        SESSION=data.session;
        await afterAuth(name);

    finally{authBusy=false;go.disabled=false;go.textContent=authMode==='up'?'יצירת חשבון':'כניסה'}
  };

  setTimeout(()=>{const el=document.getElementById('aEmail');if(el)el.focus()},60);
}

/* ==================== דשבורד ==================== */
function viewDash(){
  const{income,expense,net}=totals(month);
  const budgetTotal=S.categories.reduce((a,c)=>a+monthlyAlloc(c),0);
  const pct=budgetTotal?expense/budgetTotal*100:0;
  const st=status(pct), pc=pace(month);
  const use={};S.categories.forEach(c=>use[c.id]=usage(c,month));
  const over=S.categories.filter(c=>c.budget>0&&use[c.id].pct>100);
  const near=S.categories.filter(c=>c.budget>0&&use[c.id].pct<=100&&use[c.id].pct>=85);
  const nAlerts=over.length+near.length+(net<0?1:0);

  let bar;
  if(!nAlerts)bar=`<button class="alertbar ok" id="alertToggle"><span class="ic">✓</span><span>הכול בשליטה — אין חריגות החודש</span></button>`;
  else{
    const kind=over.length||net<0?'crit':'warn', parts=[];
    if(over.length)parts.push(`${over.length} ${over.length===1?'קטגוריה בחריגה':'קטגוריות בחריגה'}`);
    if(near.length)parts.push(`${near.length} קרובות לתקרה`);
    if(net<0)parts.push('החודש בגירעון');
    bar=`<button class="alertbar ${kind}" id="alertToggle"><span class="ic">${kind==='crit'?'⛔':'⚠️'}</span>
      <span><b>${parts.join(' · ')}</b></span><span class="arrow">${alertsOpen?'הסתרה ▲':'פירוט ▼'}</span></button>`;
  }
  let list='';
  if(alertsOpen&&nAlerts){
    list='<div class="alertlist">';
    if(net<0)list+=`<div class="row crit"><span>⛔</span><span>ההוצאות גבוהות מההכנסות ב-<b>${money(-net)}</b> החודש.</span></div>`;
    over.forEach(c=>list+=`<div class="row crit"><span>${c.icon}</span><span><b>${esc(c.name)}</b> — חריגה של ${money(use[c.id].sp-c.budget)}${c.freq>1?` (נמדד על ${c.freq} החודשים האחרונים)`:''}.</span></div>`);
    near.forEach(c=>list+=`<div class="row warn"><span>${c.icon}</span><span><b>${esc(c.name)}</b> — נותרו ${money(c.budget-use[c.id].sp)}.</span></div>`);
    list+='</div>';
  }
  /* בהזמנה של בן משפחה אין טעם להציק על גיבויים — הנתונים בשרת. */
  let backup='';
  if(S.members.length<2&&S.tx.length>8)
    backup=`<button class="alertbar info" id="backupBar"><span class="ic">👥</span>
      <span>עדיין אתם לבד במשפחה. הזמינו את בן/בת הזוג כדי שתראו את אותה תמונה.</span>
      <span class="arrow">הזמנה ←</span></button>`;

  const withPct=S.categories.map(c=>({c,u:use[c.id]}));
  const active=withPct.filter(x=>x.u.sp>0);
  const shown=(showAllCats?withPct:active).sort((a,b)=>b.u.pct-a.u.pct||b.u.sp-a.u.sp);
  const hidden=withPct.length-active.length;
  const left=budgetTotal-expense;

  let paceHtml='';
  if(pc){
    const d=Math.round(pc.delta);
    const good=d<=2, warn=d>2&&d<=10;
    const col=good?'var(--good)':warn?'var(--warning)':'var(--critical)';
    paceHtml=`<div class="pacepill" style="color:${col};background:color-mix(in srgb,${col} 10%,var(--surface-1));border-color:color-mix(in srgb,${col} 30%,transparent)">
      <span>${good?'✓':d>10?'⛔':'⚠️'}</span>
      <span>${good?`בקצב טוב — עברו ${Math.round(pc.frac*100)}% מהחודש והוצאתם ${Math.round(pc.spent/pc.budget*100)}% מהשוטף`
        :`${Math.abs(d)}% ${d>0?'מעל הקצב':'מתחת לקצב'} — ביום ${pc.day} מתוך ${pc.dim} צפוי היה ${money(pc.expected)}, בפועל ${money(pc.spent)}`}</span></div>`;
  }

  return `
  <div class="card">
    <div class="hero">
      ${ringSvg(pct,st.c)}
      <div class="main">
        <div class="cap">נותר להוציא החודש</div>
        <div class="big ${left<0?'neg':''}">${money(Math.max(left,0))}</div>
        <div class="note">${left<0?`חרגתם ב-${money(-left)} מהתקציב הכולל`:`מתוך תקציב של ${money(budgetTotal)} · נוצלו ${Math.round(pct)}%`}</div>
        ${paceHtml}
      </div>
    </div>
    <div class="split">
      <div class="mini"><div class="l"><i class="dot" style="background:var(--s1)"></i>הכנסות</div><div class="v">${money(income)}</div></div>
      <div class="mini"><div class="l"><i class="dot" style="background:var(--s2)"></i>הוצאות</div><div class="v">${money(expense)}</div></div>
      <div class="mini"><div class="l"><i class="dot" style="background:${net>=0?'var(--good)':'var(--critical)'}"></i>${net>=0?'עודף':'גירעון'}</div>
        <div class="v ${net>=0?'pos':'neg'}">${money(Math.abs(net))}</div></div>
    </div>
  </div>

  ${backup}${bar}${list}

  <div class="card">
    <h2>🎯 ניצול תקציב</h2>
    <p class="sub">${monthLabel(month)} · ממוין לפי לחץ תקציבי${pc?' · הקו האנכי מסמן איפה אמורים להיות היום':''}</p>
    ${shown.length?`<div class="bars">${shown.map(x=>barRow(x.c,x.u,pc)).join('')}</div>`:
      `<div class="empty"><span class="eic">🌱</span>עדיין אין הוצאות החודש.<br>לחצו על ה-<b>+</b> כדי לרשום את הראשונה.</div>`}
    ${hidden>0?`<button class="linkbtn" id="toggleCats">${showAllCats?'הצגת פעילות בלבד':`הצגת ${hidden} קטגוריות ללא הוצאה`}</button>`:''}
  </div>

  <div class="card">
    <h2>🧾 תנועות אחרונות</h2>
    <p class="sub">לחיצה על תנועה פותחת אותה לעריכה</p>
    ${txList(txOf(month).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.mt||0)-(a.mt||0)).slice(0,5))}
    ${txOf(month).length>5?`<button class="linkbtn" id="allTx">הצגת כל ${txOf(month).length} התנועות ←</button>`:''}
  </div>

  <div class="grid g2">
    <div class="card">
      <h2>📈 מגמה — 6 חודשים</h2>
      <p class="sub">הכנסות מול הוצאות</p>
      <div class="legend"><span><i class="dot" style="background:var(--s1)"></i>הכנסות</span><span><i class="dot" style="background:var(--s2)"></i>הוצאות</span></div>
      <div class="chart-wrap" id="trendWrap">${trendChart()}<div class="tip" id="trendTip"></div></div>
    </div>
    <div class="card">
      <h2>👥 מי הוציא</h2>
      <p class="sub">${monthLabel(month)}</p>
      ${memberChart()}
    </div>
  </div>`;
}

function ringSvg(pct,color){
  const r=46,C=2*Math.PI*r,p=Math.min(pct,100);
  return `<div class="ring"><svg width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="ניצול ${Math.round(pct)} אחוז מהתקציב">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--grid)" stroke-width="10"/>
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 56 56)"/>
    <text x="56" y="54" text-anchor="middle" font-size="23" font-weight="800" fill="var(--text-primary)">${Math.round(pct)}%</text>
    <text x="56" y="71" text-anchor="middle" font-size="10.5" fill="var(--muted)">נוצל</text></svg></div>`;
}
function barRow(c,u,pc){
  const st=status(u.b?u.pct:0);
  const showPace=pc&&!isFixedCat(c.id)&&u.f===1&&u.b>0;
  return `<div class="brow">
    <div class="line1"><span class="ic">${c.icon}</span><span class="nm">${esc(c.name)}</span>
      ${u.f>1?`<span class="freq">${freqLabel(u.f)}</span>`:''}
      <span class="amt">${money(u.sp)}${u.b?' / '+money(u.b):''}</span>
      <span class="pct" style="color:${u.pct>100?'var(--critical)':'var(--text-secondary)'}">${st.ic} ${u.b?Math.round(u.pct)+'%':'—'}</span></div>
    <div class="track">
      <div class="fill" style="width:${u.pct>100?(100/u.pct*100).toFixed(1):Math.min(u.pct,100)}%;background:${u.pct>100?'var(--critical)':sc(c.slot||1)}"></div>
      ${u.pct>100?`<div class="over" style="inset-inline-start:${(100/u.pct*100).toFixed(1)}%;inset-inline-end:0"></div>`:''}
      ${showPace?`<div class="pacemark" style="inset-inline-start:calc(${(pc.frac*100/Math.max(1,u.pct/100)).toFixed(1)}% - 1px)"></div>`:''}
    </div></div>`;
}
function txList(list){
  if(!list.length)return `<div class="empty"><span class="eic">🧾</span>אין תנועות להצגה.</div>`;
  return `<div class="tlist">${list.map(t=>{
    const c=anyCat(t.catId), m=who(t);
    return `<button class="titem editTx" data-id="${t.id}">
      <span class="av">${c?c.icon:'❓'}</span>
      <span class="mid"><span class="t1">${t.note?esc(t.note):(c?esc(c.name):'תנועה')}</span>
        <span class="t2">${c&&t.note?esc(c.name)+' ·':''} ${avatar(m)} ${m?esc(m.name):'—'} · ${t.date.slice(8,10)}/${t.date.slice(5,7)}${t.fixed?' <span class="pin">קבועה</span>':''}</span></span>
      <span class="val ${t.type==='income'?'pos':''}"><bdi dir="ltr">${t.type==='income'?'+':'−'}${money(t.amount)}</bdi></span>
      <span class="chev">‹</span></button>`}).join('')}</div>`;
}

let trendData=[], chartW=520;
function trendChart(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(month,-i));
  trendData=ms.map(m=>({m,...totals(m)}));
  const narrow=innerWidth<720;
  const W=chartW=narrow?340:520,H=narrow?215:200,PL=12,PR=narrow?46:60,PT=12,PB=26;
  const max=Math.max(1000,...trendData.flatMap(d=>[d.income,d.expense]))*1.12;
  const step=(W-PL-PR)/5, x=i=>(W-PR)-i*step, y=v=>PT+(H-PT-PB)*(1-v/max);
  const path=k=>trendData.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join(' ');
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף הכנסות מול הוצאות">
    ${ticks.map(t=>`<line x1="${PL}" x2="${W-PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--grid)"/>
      <text x="${W-PR+11}" y="${(y(t)+4).toFixed(1)}" font-size="10" fill="var(--muted)">${max>=6000?nf.format(Math.round(t/1000))+'k':nf.format(Math.round(t))}</text>`).join('')}
    <line x1="${PL}" x2="${W-PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>
    ${trendData.map((d,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)">${shortMonth(d.m)}</text>`).join('')}
    <path d="${path('income')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path('expense')}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${trendData.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.income)}" r="4" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"/>
      <circle cx="${x(i)}" cy="${y(d.expense)}" r="4" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>`).join('')}
    <line id="trendCross" x1="0" x2="0" y1="${PT}" y2="${H-PB}" stroke="var(--axis)" opacity="0"/>
    ${trendData.map((d,i)=>`<rect class="hitzone" data-i="${i}" x="${(x(i)-step/2).toFixed(1)}" y="${PT}" width="${step.toFixed(1)}" height="${H-PT-PB}" fill="transparent"/>`).join('')}
  </svg>`;
}
function memberChart(){
  const by={},info={};
  txOf(month).filter(t=>t.type==='expense').forEach(t=>{
    const w=who(t), k=w?w.id:'—';
    by[k]=(by[k]||0)+t.amount; if(w)info[k]=w;
  });
  const rows=S.members.map(m=>({name:m.name,v:by[m.id]||0,slot:m.slot}));
  Object.keys(by).filter(k=>String(k).indexOf('lbl:')===0)
    .forEach(k=>rows.push({name:info[k].name,v:by[k],slot:info[k].slot}));
  if(by['—'])rows.push({name:'לא משויך',v:by['—'],slot:8});
  const tot=rows.reduce((a,r)=>a+r.v,0), max=Math.max(1,...rows.map(r=>r.v));
  if(!tot)return `<div class="empty"><span class="eic">👥</span>אין עדיין הוצאות החודש.</div>`;
  return `<div class="bars">${rows.map(r=>`<div class="brow">
    <div class="line1"><span class="nm">${esc(r.name)}</span><span class="amt">${money(r.v)}</span>
      <span class="pct">${Math.round(r.v/tot*100)}%</span></div>
    <div class="track"><div class="fill" style="width:${r.v/max*100}%;background:${sc(r.slot)}"></div></div></div>`).join('')}</div>`;
}
function wireTxClicks(){
  document.querySelectorAll('.editTx').forEach(b=>b.onclick=()=>{
    const t=S.tx.find(x=>x.id===b.dataset.id);
    if(t)openSheet(Object.assign({},t,{amount:String(t.amount)}));
  });
}
function wireDash(){
  const at=document.getElementById('alertToggle');if(at)at.onclick=()=>{alertsOpen=!alertsOpen;render()};
  const tc=document.getElementById('toggleCats');if(tc)tc.onclick=()=>{showAllCats=!showAllCats;render()};
  const al=document.getElementById('allTx');if(al)al.onclick=()=>go('tx');
  const bb=document.getElementById('backupBar');if(bb)bb.onclick=()=>go('settings');
  wireTxClicks();
  const wrap=document.getElementById('trendWrap');if(!wrap)return;
  const tip=document.getElementById('trendTip'),svg=wrap.querySelector('svg'),cross=svg.querySelector('#trendCross');
  svg.querySelectorAll('.hitzone').forEach(z=>{
    const show=()=>{
      const d=trendData[+z.dataset.i], cx=+z.getAttribute('x')+ +z.getAttribute('width')/2;
      cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('opacity','.9');
      tip.innerHTML=`<b>${monthLabel(d.m)}</b>
        <div class="tip-row"><i class="dot" style="background:var(--s1)"></i>הכנסות<b style="margin-inline-start:auto">${money(d.income)}</b></div>
        <div class="tip-row"><i class="dot" style="background:var(--s2)"></i>הוצאות<b style="margin-inline-start:auto">${money(d.expense)}</b></div>
        <div class="tip-row" style="border-top:1px solid var(--grid);padding-top:5px">מאזן<b style="margin-inline-start:auto" class="${d.net>=0?'pos':'neg'}">${money(d.net)}</b></div>`;
      const r=svg.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
      tip.style.opacity=1;
      tip.style.left=Math.max(4,Math.min((cx/chartW)*r.width+(r.left-wr.left)-72,wr.width-158))+'px';
      tip.style.top='4px';
    };
    z.addEventListener('mouseenter',show);
    z.addEventListener('touchstart',show,{passive:true});
    z.addEventListener('mouseleave',()=>{tip.style.opacity=0;cross.setAttribute('opacity','0')});
  });
}

/* ==================== מסך תנועה ==================== */
let sheetOpen=false, draft=null;
function openSheet(preset){
  /* ברירת המחדל היא אני — מי שפותח את המסך הוא בדרך כלל מי ששילם */
  draft=Object.assign({type:'expense',amount:'',catId:'',memberId:myMemberId(),
    memberLabel:null,date:todayStr(),note:''},preset||{});
  sheetOpen=true;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheetDel').classList.toggle('hide',!draft.id);
  document.body.style.overflow='hidden';
  drawSheet();
}
function closeSheet(){
  sheetOpen=false;
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  document.body.style.overflow='';
}
function drawSheet(){
  const cats=draft.type==='expense'?S.categories:S.incomeCats;
  if(!cats.find(c=>c.id===draft.catId))draft.catId=(cats[0]||{}).id||'';
  const amt=String(draft.amount||''), disp=amt?nf.format(+amt):'0';
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  document.getElementById('sheetTitle').textContent=draft.id?'עריכת תנועה':'רישום מהיר';
  document.getElementById('sheetBody').innerHTML=`
    <div class="amtbox"><span class="val ${amt?'':'zero'}"><span class="cur">₪</span>${disp}</span></div>
    <div class="seg" id="sType" style="margin-bottom:14px">
      <button data-v="expense" aria-pressed="${draft.type==='expense'}">↓ הוצאה</button>
      <button data-v="income" aria-pressed="${draft.type==='income'}">↑ הכנסה</button></div>
    <div class="keypad" id="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="00">00</button><button data-k="0">0</button><button data-k="del">⌫</button></div>
    <div class="fieldlbl">קטגוריה</div>
    <div class="catgrid" id="sCats">${cats.map(c=>
      `<button data-id="${c.id}" aria-pressed="${c.id===draft.catId}"><span class="ci">${c.icon}</span>${esc(c.name)}</button>`).join('')}</div>
    <div class="fieldlbl">${draft.type==='expense'?'מי שילם':'מי קיבל'}</div>
    <div class="chipsel" id="sMem">${S.members.map(m=>
      `<button data-id="${m.id}" aria-pressed="${!draft.memberLabel&&m.id===draft.memberId}">${avatar(m)}${esc(m.name)}</button>`).join('')}
      ${labelList().map((n,i)=>
      `<button data-lbl="${esc(n)}" aria-pressed="${draft.memberLabel===n}">${avatar({name:n,slot:S.members.length+i+1})}${esc(n)}</button>`).join('')}
      <button data-lbl="__new" aria-pressed="false">＋ מישהו אחר</button></div>
    <div class="fieldlbl">מתי</div>
    <div class="chipsel" id="sDate">
      <button data-d="${todayStr()}" aria-pressed="${draft.date===todayStr()}">היום</button>
      <button data-d="${y}" aria-pressed="${draft.date===y}">אתמול</button>
      <label class="f" style="flex:1;min-width:140px"><input type="date" id="sDateIn" value="${draft.date}"></label></div>
    <div class="fieldlbl">תיאור (לא חובה)</div>
    <input id="sNote" value="${esc(draft.note||'')}" placeholder="למשל: קניות בשופרסל">
    ${draft.id?`<button class="linkbtn" id="sDup">📄 שכפול התנועה להיום</button>`:''}`;
  document.getElementById('sheetSave').disabled=!(+draft.amount>0&&draft.catId);
  wireSheet();
}
function wireSheet(){
  document.querySelectorAll('#sType button').forEach(b=>b.onclick=()=>{draft.type=b.dataset.v;draft.catId='';drawSheet()});
  document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  document.querySelectorAll('#sCats button').forEach(b=>b.onclick=()=>{draft.catId=b.dataset.id;drawSheet()});
  document.querySelectorAll('#sMem button').forEach(b=>b.onclick=()=>{
    if(b.dataset.lbl==='__new'){
      const n=(prompt('שם האדם (מישהו שאין לו חשבון במערכת):')||'').trim();
      if(!n)return;
      draft.memberId=null;draft.memberLabel=n;
    }else if(b.dataset.lbl){draft.memberId=null;draft.memberLabel=b.dataset.lbl}
    else{draft.memberId=b.dataset.id;draft.memberLabel=null}
    drawSheet()});
  document.querySelectorAll('#sDate button').forEach(b=>b.onclick=()=>{draft.date=b.dataset.d;drawSheet()});
  document.getElementById('sDateIn').onchange=e=>{draft.date=e.target.value||todayStr();drawSheet()};
  document.getElementById('sNote').oninput=e=>draft.note=e.target.value;
  const dup=document.getElementById('sDup');
  if(dup)dup.onclick=()=>{const d=Object.assign({},draft);delete d.id;delete d.mt;delete d.fixed;d.date=todayStr();openSheet(d)};
}
function key(k){
  const a=String(draft.amount||'');
  if(k==='del')draft.amount=a.slice(0,-1);
  else if(a.length<7)draft.amount=(a==='0'?'':a)+k;
  drawSheet();
}
function saveDraft(){
  if(!(+draft.amount>0)||!draft.catId)return;
  const c=anyCat(draft.catId);
  const edited=!!draft.id, amount=+draft.amount, type=draft.type, dt=draft.date;
  if(edited){
    const t=S.tx.find(x=>x.id===draft.id);
    Object.assign(t,{type,amount,catId:draft.catId,memberId:draft.memberId||null,
      memberLabel:draft.memberLabel||null,date:dt,note:(draft.note||'').trim()});
    touch(t);
  } else S.tx.push(touch({id:uid(),type,amount,catId:draft.catId,memberId:draft.memberId||null,
    memberLabel:draft.memberLabel||null,date:dt,note:(draft.note||'').trim()}));
  save();
  if(dt.slice(0,7)!==month)month=dt.slice(0,7);
  closeSheet();render();
  toast(edited?'התנועה עודכנה ✓':`${type==='income'?'הכנסה':'הוצאה'} של ${money(amount)} נרשמה ב"${c?c.name:''}" ✓`);
}
function deleteDraft(){
  if(!draft.id)return;
  const backup=Object.assign({},S.tx.find(t=>t.id===draft.id));
  removeRec('tx',draft.id);save();closeSheet();render();
  toast('התנועה נמחקה',{label:'ביטול',fn:()=>{undoRemove('tx',backup);render()}});
}
document.getElementById('fab').onclick=()=>openSheet();
document.getElementById('sheetX').onclick=closeSheet;
document.getElementById('scrim').onclick=closeSheet;
document.getElementById('sheetSave').onclick=saveDraft;
document.getElementById('sheetDel').onclick=deleteDraft;
addEventListener('keydown',e=>{
  if(!sheetOpen)return;
  if(e.key==='Escape')return closeSheet();
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(/^[0-9]$/.test(e.key)){key(e.key);e.preventDefault()}
  else if(e.key==='Backspace'){key('del');e.preventDefault()}
  else if(e.key==='Enter'){saveDraft();e.preventDefault()}
});

/* ==================== תנועות ==================== */
function viewTx(){
  const q=txSearch.trim().toLowerCase();
  const list=txOf(month).filter(t=>{
    if(txFilter.cat&&t.catId!==txFilter.cat)return false;
    if(txFilter.member){const w=who(t);if(!w||w.id!==txFilter.member)return false}
    if(txFilter.type&&t.type!==txFilter.type)return false;
    if(q){const c=anyCat(t.catId);
      if(!(((t.note||'')+' '+(c?c.name:'')+' '+t.amount).toLowerCase().includes(q)))return false}
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date)||(b.mt||0)-(a.mt||0));
  const sum=list.reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0);
  const filtered=txFilter.cat||txFilter.member||txFilter.type||q;
  return `
  <div class="card">
    <h2>📝 תנועות — ${monthLabel(month)}</h2>
    <p class="sub">${list.length} תנועות · מאזן מוצג: <b class="${sum>=0?'pos':'neg'}">${money(Math.abs(sum))}</b> ${sum>=0?'עודף':'גירעון'}</p>
    <input id="flQ" placeholder="🔍 חיפוש בתיאור, בקטגוריה או בסכום" value="${esc(txSearch)}" style="margin-bottom:10px">
    <div class="toolbar">
      <select id="flType" style="width:auto"><option value="">הכול</option><option value="expense" ${txFilter.type==='expense'?'selected':''}>הוצאות</option><option value="income" ${txFilter.type==='income'?'selected':''}>הכנסות</option></select>

async function healthReport(){
  const L=[];const add=(ok,label,val)=>L.push({ok,label,val:String(val)});
  add(!!SESSION,'מחוברים כ', SESSION?SESSION.user.email:'לא מחוברים');
  add(!!HH,'משפחה', HH?HH.name:'—');
  add(true,'נתונים', `${S.tx.length} תנועות · ${S.categories.length} קטגוריות · ${S.members.length} בני משפחה`);
  const pend=DIRTY.size+GONE.length;
  add(pend===0,'ממתין לשמירה', pend?`${pend} שינויים בדרך לשרת`:'הכול נשמר');
  add(!lastError,'שגיאה אחרונה', lastError||'אין');
  add(navigator.onLine,'חיבור לאינטרנט', navigator.onLine?'מחובר':'מנותק');
  try{
    const t0=performance.now();
    const {error}=await sb.from('households').select('id').limit(1);
    add(!error,'תקשורת עם השרת', error?error.message:Math.round(performance.now()-t0)+' מ״ש');
  }catch(e){add(false,'תקשורת עם השרת',e.message)}
  return L;
}

function dl(name,txt,type){const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){
  dl(`הכיס-המשפחתי-${thisMonth()}.json`,JSON.stringify(
    {household:HH,categories:S.categories,incomeCats:S.incomeCats,members:S.members,
     tx:S.tx,recurring:S.recurring},null,2),'application/json');
  toast('הקובץ הורד ✓');
}
function exportCsv(){
  const head=['תאריך','סוג','קטגוריה','מי','תיאור','סכום'];
  const rows=S.tx.slice().sort((a,b)=>a.date<b.date?1:-1).map(t=>{
    const c=anyCat(t.catId),m=memById(t.memberId);
    return [t.date,t.type==='income'?'הכנסה':'הוצאה',c?c.name:'',
            m?m.name:(t.memberLabel||''),t.note||'',t.amount];
  });
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  dl(`תנועות-${thisMonth()}.csv`,[head,...rows].map(r=>r.map(q).join(',')).join('\n'),'text/csv;charset=utf-8');
  toast('הקובץ הורד ✓');
}

  ['✉️','הזמנה ממתינה','אם הגעתם מקישור הזמנה, הוא נשמר עד להשלמת ההרשמה ואז נמחק.','הכרחי'],
];

function cookieDetailsHtml(){
  return `<div class="ckrows">${COOKIE_ROWS.map(([ic,t,d,k])=>`
    <div class="ckrow"><span class="ck-ic">${ic}</span>
      <span><b>${t}</b> <span class="ck-tag">${k}</span><br><span class="sub">${d}</span></span></div>`).join('')}
    </div>
    <p class="sub" style="margin:12px 0 0">אין באפליקציה עוגיות פרסום, מדידה או מעקב, ואיננו משתפים מידע עם צד שלישי
      למטרות שיווק. הנתונים הפיננסיים עצמם אינם נשמרים במכשיר אלא בבסיס הנתונים שלנו,
      ונגישים רק לבני המשפחה שלכם.</p>`;
}

function showCookieBar(){
  if(cookieAck())return;
  const el=document.getElementById('ckbar');
  el.innerHTML=`
    <div class="ckbox">
      <div class="cktop">
        <span class="ck-ic" style="font-size:20px">🍪</span>
        <div>
          <b>אחסון במכשיר שלכם</b>
          <p class="sub" style="margin:3px 0 0">אנחנו שומרים במכשיר רק את מה שנדרש כדי שהאפליקציה תעבוד —
            שתישארו מחוברים ושנזכור את ההעדפות שלכם. בלי פרסום, בלי מעקב, בלי צד שלישי.</p>
        </div>
      </div>
      <div id="ckDetails" class="hide">${cookieDetailsHtml()}</div>
      <div class="toolbar" style="margin-top:12px">
        <button class="btn" id="ckOk">הבנתי</button>
        <button class="btn ghost" id="ckMore">מה בדיוק נשמר?</button>
      </div>
    </div>`;
  el.classList.add('on');
  document.getElementById('ckOk').onclick=()=>{
    try{localStorage.setItem(COOKIE_KEY,new Date().toISOString())}catch(e){}
    el.classList.remove('on');el.innerHTML='';
  };
  document.getElementById('ckMore').onclick=e=>{
    const d=document.getElementById('ckDetails'), open=!d.classList.contains('hide');
    d.classList.toggle('hide',open);
    e.target.textContent=open?'מה בדיוק נשמר?':'סגירת הפירוט';
  };
}

/* אותו מידע, זמין תמיד — לא רק בפעם הראשונה */

    ${when&&when!=='x'?`<p class="sub" style="margin:12px 0 0">אישרתם את ההודעה ב-${new Date(when).toLocaleDateString('he-IL')}.</p>`:''}
    <div class="toolbar" style="margin-top:10px">
      <button class="btn ghost" id="ckClear">ניקוי האחסון המקומי והתנתקות</button>
    </div>
    <p class="sub" style="margin:8px 0 0">הניקוי מוחק רק את מה ששמור בדפדפן הזה.
