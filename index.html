function wireCookieCard(){
  const b=document.getElementById('ckClear');
  if(b)b.onclick=async()=>{
    if(!confirm('לנקות את האחסון המקומי ולהתנתק?\n\nהתקציב עצמו לא נמחק — הוא שמור בשרת.'))return;
    if(DIRTY.size||GONE.length)await flush();
    try{[COOKIE_KEY,THEME_KEY,INV_KEY].forEach(k=>localStorage.removeItem(k))}catch(e){}
    signOut();
    setTimeout(showCookieBar,300);
  };
}

/* ==================== אשף ====================
   במערכת עם משתמשים, "בני משפחה" הם חשבונות — מצטרפים דרך קישור הזמנה.
   האשף שואל רק על מה שהוא באמת יכול לקבוע: השם שלכם, ההכנסות,
   הקבועות והתקציבים. */
let wz={step:0,myName:'',earners:[],incomes:{},fixed:{},budgets:{}};
const FIXED_SUGGEST=[['🏠','משכנתא / שכר דירה'],['🏛️','ארנונה'],['💡','חשמל'],['🚿','מים'],['🛡️','ביטוחים'],['📱','תקשורת'],['🎒','חינוך וחוגים']];
const BUDGET_SUGGEST=['סופר ומזון','דלק ותחבורה','בילויים ומסעדות','ביגוד והנעלה','חיסכון והשקעות'];

function me(){return S.members.find(m=>m.id===(SESSION&&SESSION.user&&SESSION.user.id))||S.members[0]||null}

function startWizard(){
  const m=me();
  wz={step:0,myName:m?m.name:displayNameGuess(),
      earners:S.members.filter(x=>!m||x.id!==m.id).map(x=>x.name),
      incomes:{},fixed:{},budgets:{}};
  S.categories.forEach(c=>wz.budgets[c.name]=c.budget);
  document.getElementById('wiz').classList.add('on');document.body.style.overflow='hidden';drawWiz();
}
function endWizard(){
  document.getElementById('wiz').classList.remove('on');document.body.style.overflow='';
  markOnboarded();go('dash');
}
function drawWiz(){
  const el=document.getElementById('wizIn');
  const bars=n=>`<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
  const foot=(next,back)=>`<div class="foot">${back?`<button class="btn ghost" id="wBack">חזרה</button>`:''}
    <button class="btn" id="wNext" style="flex:1">${next}</button><button class="skip" id="wSkip">דילוג</button></div>`;

  if(wz.step===0){
    el.innerHTML=`${bars(0)}<div class="body"><h1>ברוכים הבאים 👋</h1>
      <p class="lead">נגדיר את התקציב בארבעה צעדים קצרים — כדקה בסך הכול. אפשר לשנות הכול אחר כך.</p>
      <div class="fieldlbl">איך קוראים לכם?</div>
      <div class="rowline"><span class="ic">🧑</span>
        <input id="wMyName" value="${esc(wz.myName)}" placeholder="השם שיוצג לבני המשפחה" style="max-width:none"></div>
      <div class="fieldlbl">מי עוד מכניס כסף הביתה?</div>
      <p class="sub" style="margin:0 0 10px">מספיק שם — לא צריך שיהיה להם חשבון.
        כשתרצו שהם יוכלו לרשום הוצאות בעצמם, תשלחו להם קישור הזמנה מההגדרות.</p>
      ${wz.earners.map((n,i)=>`<div class="rowline"><span class="ic">${['👩','🧒','👦','🧓'][i%4]}</span>
        <input class="wEarn" data-i="${i}" value="${esc(n)}" placeholder="שם" style="max-width:none"></div>`).join('')}
      <button class="linkbtn" id="wAddEarn">+ הוספת מפרנס/ת</button></div>${foot('בואו נתחיל ←',false)}`;
    el.querySelector('#wMyName').oninput=e=>wz.myName=e.target.value;
    el.querySelectorAll('.wEarn').forEach(inp=>inp.oninput=()=>wz.earners[+inp.dataset.i]=inp.value);
    el.querySelector('#wAddEarn').onclick=()=>{wz.earners.push('');drawWiz()};

  } else if(wz.step===1){
    const ppl=wizPeople();
    el.innerHTML=`${bars(1)}<div class="body"><h1>כמה נכנס בחודש? 💼</h1>
      <p class="lead">ההכנסה נטו של כל אחד. זה הבסיס לחישוב כמה נשאר בכיס.</p>
      ${ppl.map(n=>`<div class="rowline"><span class="ic">💼</span>
        <span class="nm">${esc(n)}</span><input class="wInc" data-n="${esc(n)}" type="number" inputmode="decimal" placeholder="0" value="${wz.incomes[n]||''}"></div>`).join('')}
      </div>${foot('המשך ←',true)}`;
    el.querySelectorAll('.wInc').forEach(i=>i.oninput=()=>wz.incomes[i.dataset.n]=+i.value||0);

  } else if(wz.step===2){
    el.innerHTML=`${bars(2)}<div class="body"><h1>מה יוצא בכל חודש? 🔁</h1>
      <p class="lead">סמנו את ההוצאות הקבועות שלכם ומלאו סכום. הן ייטענו אוטומטית בכל חודש בלחיצה אחת.</p>
      ${FIXED_SUGGEST.map(([ic,n])=>`<div class="checkline">
        <input type="checkbox" class="wfChk" data-n="${esc(n)}" ${wz.fixed[n]!==undefined?'checked':''}>
        <span class="nm"><span>${ic}</span>${esc(n)}</span>
        <input type="number" class="wfAmt" data-n="${esc(n)}" inputmode="decimal" placeholder="₪" value="${wz.fixed[n]||''}"></div>`).join('')}
      </div>${foot('המשך ←',true)}`;
    el.querySelectorAll('.wfChk').forEach(c=>c.onchange=()=>{
      if(c.checked)wz.fixed[c.dataset.n]=wz.fixed[c.dataset.n]||0;else delete wz.fixed[c.dataset.n]});
    el.querySelectorAll('.wfAmt').forEach(a=>a.oninput=()=>{wz.fixed[a.dataset.n]=+a.value||0;
      const chk=el.querySelector(`.wfChk[data-n="${CSS.escape(a.dataset.n)}"]`);if(chk)chk.checked=true});

  } else {
    const inc=Object.values(wz.incomes).reduce((a,b)=>a+b,0);
    const fx=Object.values(wz.fixed).reduce((a,b)=>a+b,0), left=inc-fx;
    el.innerHTML=`${bars(3)}<div class="body"><h1>כמה להקצות לשוטף? 🎯</h1>
      <p class="lead">${inc?`אחרי ההוצאות הקבועות (${money(fx)}) נשארו לכם <b>${money(left)}</b> בחודש. חלקו אותם:`:'קבעו תקרה חודשית לקטגוריות המשתנות:'}</p>
      ${BUDGET_SUGGEST.map(n=>{const c=S.categories.find(x=>x.name===n);return `<div class="checkline">
        <span class="nm"><span>${c?c.icon:'📌'}</span>${esc(n)}</span>
        <input type="number" class="wbAmt" data-n="${esc(n)}" inputmode="decimal" value="${wz.budgets[n]||''}"></div>`}).join('')}
      <p class="sub" id="wLeft" style="margin-top:14px"></p></div>${foot('סיום והתחלה ✓',true)}`;
    const upd=()=>{const used=BUDGET_SUGGEST.reduce((a,n)=>a+(wz.budgets[n]||0),0);
      document.getElementById('wLeft').innerHTML=inc?(left-used>=0?`נשארו ${money(left-used)} לחיסכון או לבלת"מ 👍`:`<span class="neg">חרגתם ב-${money(used-left)} מההכנסה הפנויה</span>`):''};
    el.querySelectorAll('.wbAmt').forEach(a=>a.oninput=()=>{wz.budgets[a.dataset.n]=+a.value||0;upd()});
    upd();
  }

  const nx=el.querySelector('#wNext'),bk=el.querySelector('#wBack'),sk=el.querySelector('#wSkip');
  nx.onclick=()=>{if(wz.step<3){wz.step++;drawWiz()}else applyWizard()};
  if(bk)bk.onclick=()=>{wz.step--;drawWiz()};
  sk.onclick=()=>{if(confirm('לדלג על המדריך? אפשר להפעיל אותו שוב מההגדרות.'))endWizard()};
}

/* השם שלכם ראשון, ואחריו שאר המפרנסים — בלי כפילויות ובלי ריקים */
function wizPeople(){
  const out=[];
  [wz.myName].concat(wz.earners).map(n=>(n||'').trim()).forEach(n=>{
    if(n&&out.indexOf(n)<0)out.push(n)});
  return out;
}

function applyWizard(){
  const mine=(wz.myName||'').trim();
  const m=me();
  if(m&&mine&&m.name!==mine){touch(m);m.name=mine}

  /* הכנסות: לי — משויכת לחשבון; לאחרים — שם חופשי על התנועה */
  wizPeople().forEach(n=>{
    const v=wz.incomes[n];
    if(!(v>0))return;
    const isMe=m&&n===(m.name||mine);
    S.tx.push(touch({id:uid(),type:'income',amount:v,date:month+'-01',
      catId:(S.incomeCats[0]||{}).id||null,
      memberId:isMe?m.id:null, memberLabel:isMe?null:n, note:'משכורת'}));
  });

  Object.entries(wz.fixed).forEach(([n,v])=>{
    if(!(v>0))return;
    const c=S.categories.find(x=>x.name===n);
    if(!S.recurring.find(r=>r.name===n))
      S.recurring.push(touch({id:uid(),name:n,amount:v,catId:c?c.id:(S.categories[0]||{}).id||null,
        memberId:m?m.id:null,day:1,active:true}));
    if(c){touch(c);c.budget=v;c.freq=1}
  });
  Object.entries(wz.budgets).forEach(([n,v])=>{
    const c=S.categories.find(x=>x.name===n);if(c&&v>0){touch(c);c.budget=v}});

  save(true);
  const n=S.recurring.filter(r=>r.active!==false).length;
  endWizard();
  toast(n?`הכול מוכן! ${n} הוצאות קבועות ממתינות לטעינה בלשונית "קבועות" 🔁`:'הכול מוכן! לחצו על ה-+ כדי לרשום הוצאה ראשונה 🎉');
}

/* ==================== אתחול ==================== */
/* מצב חשבון עולמי: month/tab/... מוגדרים כאן כי הם משותפים לכל המסכים */
let month=new Date().toISOString().slice(0,7);
let tab='dash', showAllCats=false, alertsOpen=false, txSearch='';
let txFilter={cat:'',member:'',type:''};

/* ---------- התקנה כאפליקציה ---------- */
const STANDALONE=(matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)
  ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;
  if(tab==='settings'&&HH)render()});
addEventListener('appinstalled',()=>{deferredInstall=null;toast('האפליקציה הותקנה ✓')});

/* ---------- רשת ו-Service Worker ---------- */
const setNet=()=>document.body.classList.toggle('offline',navigator.onLine===false);
addEventListener('online',()=>{setNet();if(HH)flush()});
addEventListener('offline',setNet);
setNet();
if('serviceWorker' in navigator&&(location.protocol==='https:'
   ||location.hostname==='localhost'||location.hostname==='127.0.0.1'))
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- ערכת נושא ---------- */
const THEME_KEY='hakis-theme';
try{const t=localStorage.getItem(THEME_KEY);
  if(t)document.documentElement.setAttribute('data-theme',t);
  else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}
document.getElementById('themeBtn').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  try{localStorage.setItem(THEME_KEY,d?'light':'dark')}catch(e){}};

/* ---------- כפתורי מסגרת ---------- */
document.getElementById('mPrev').onclick=()=>{month=shiftMonth(month,-1);render()};
document.getElementById('mNext').onclick=()=>{month=shiftMonth(month,1);render()};
document.getElementById('syncBtn').onclick=async()=>{
  const pend=DIRTY.size+GONE.length;
  if(pend){await flush();toast(lastError?'השמירה נכשלה — '+lastError:'נשמר ✓');return}
  await reload();toast('רועננו מהשרת ✓');
};
document.addEventListener('click',e=>{const b=e.target.closest('#tabs button,#mobnav button');if(b)go(b.dataset.tab)});

/* לא עוזבים דף עם שינוי שעוד לא נשמר */
addEventListener('beforeunload',e=>{
  if(DIRTY.size||GONE.length){flush();e.preventDefault();e.returnValue=''}
});
/* חזרה ללשונית — מושכים את מה שבן/בת הזוג הספיקו לרשום */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&HH&&!DIRTY.size&&!GONE.length)reload()});

async function reload(){
  if(!HH)return;
  try{await loadAll();render()}catch(e){lastError=e.message;setSyncUI('err')}
}

/* ---------- הזמנה מהקישור ----------
   שומרים אותה בצד, כי מסלול אישור המייל מחזיר את המשתמש לדף
   עם סולמית משלו ומוחק את שלנו. */
const INV_KEY='hakis-pending-invite';
function readInvite(){
  const m=(location.hash||'').match(/join=([0-9a-fA-F-]{36})/);
  if(m){try{localStorage.setItem(INV_KEY,m[1])}catch(e){}return m[1]}
  try{return localStorage.getItem(INV_KEY)||null}catch(e){return null}
}
function clearInvite(){try{localStorage.removeItem(INV_KEY)}catch(e){}}

/* ---------- ההמראה ---------- */
async function boot(){
  const boo=document.getElementById('boot');
  pendingInvite=readInvite();

  if(!(await initClient())){
    boo.innerHTML=`<div style="max-width:320px">
      <p style="font-size:34px;margin:0 0 8px">📡</p>
      <p><b>לא הצלחנו להתחבר לשרת.</b></p>
      <p>בדקו את החיבור לאינטרנט ורעננו את הדף.</p></div>`;
    return;
  }

  let session=null;
  try{const {data}=await sb.auth.getSession();session=data&&data.session}catch(e){}

  /* חזרה מקישור אישור מייל או איפוס סיסמה */
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='PASSWORD_RECOVERY'){SESSION=s;toast('אפשר לקבוע סיסמה חדשה בהגדרות ← החשבון שלי')}
  });

  boo.classList.add('off');
  showCookieBar();

  if(!session){SESSION=null;showAuth();return}
  SESSION=session;
  try{
    await afterAuth(null);
  }catch(e){
    lastError=e.message||String(e);
    toast('טעינת הנתונים נכשלה: '+lastError);
    showAuth();
  }
}
boot();

</script>
